name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-smoke-train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.7.2 \
            pytest==8.3.4 \
            fastapi==0.115.6 \
            httpx==0.28.1
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu

      - name: Run API and relevant unit tests
        run: |
          python -m pytest -q \
            tests/test_api.py \
            tests/test_temporal_baseline.py \
            tests/test_cross_validation.py \
            tests/test_webcam_privacy.py

      - name: Run validation accuracy gate
        run: python scripts/ci_smoke_train.py
